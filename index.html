<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inspeção Visual 2D - Piatex</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <div class="container">

        <header class="topo">

            <img
                src="/static/img/logo.png"
                class="logo-empresa"
                alt="Logo Piatex"
            >

            <h1>INSPEÇÃO VISUAL 2D</h1>

            <div class="subtitulo">
                Sistema Industrial de Inspeção
            </div>

        </header>

        <main>

            <div class="camera-box">
                <img
                    src="/video"
                    alt="Vídeo da câmera"
                >
            </div>

            <div class="painel-status">

                <div class="status-title">
                    STATUS DO SISTEMA
                </div>

                <div
                    id="status"
                    class="status-box"
                >
                    SISTEMA ONLINE
                </div>

                <div
                    id="erro"
                    class="erro-box"
                >
                    Erro visual: --
                </div>

            </div>

            <div class="botoes">

                <button
                    class="btn-inspecao"
                    onclick="inspecionar()"
                >
                    INICIAR INSPEÇÃO
                </button>

                <button
                    class="btn-reset"
                    onclick="resetar()"
                >
                    NOVA PEÇA
                </button>

            </div>

        </main>

        <footer>
            <div class="rodape">
                Piatex • Inspeção Visual Industrial • OpenCV + Python
            </div>
        </footer>

    </div>

    <script>
        function inspecionar() {
            const statusBox = document.getElementById("status");
            const erroBox = document.getElementById("erro");

            statusBox.innerText = "INSPECIONANDO...";
            statusBox.className = "status-box analisando";
            erroBox.innerText = "Erro visual: calculando...";

            fetch("/inspecionar")
                .then(response => response.json())
                .then(data => {
                    statusBox.innerText = data.status;
                    erroBox.innerText = "Erro visual: " + data.erro + "%";

                    if (data.status === "PECA OK") {
                        statusBox.className = "status-box ok";
                    } else {
                        statusBox.className = "status-box nok";
                    }
                })
                .catch(error => {
                    statusBox.innerText = "ERRO SISTEMA";
                    statusBox.className = "status-box nok";
                    erroBox.innerText = "Falha na inspeção";
                });
        }

        function resetar() {
            const statusBox = document.getElementById("status");
            const erroBox = document.getElementById("erro");

            statusBox.innerText = "SISTEMA ONLINE";
            statusBox.className = "status-box";
            erroBox.innerText = "Erro visual: --";
        }
    </script>

</body>

</html>
